validate_problem:
  system: |-
    This is an AI augmented brainstorming session.
    A team of users is trying to find a specific solution for a given problem.

  prompt: |-
    The problem is described as follows:

    "{problem}"

    Is this describing a problem that could be solved during a brainstorming session?

    {choices}

  choices:
    A: Yes, this describes a problem
    B: No, the description is unclear


summarize_problem:
  prompt: |-
    "{problem}"

    Summarize the problem description above in the following manner:

    Title: (Short title of the problem no longer than 2 words)
    Summary: (Short summary of the problem no longer than 7 words)

  preface: |-
    Title: 


generate_experts:
  system: |-
    This is an AI augmented brainstorming session.
    A team of users is trying to find a specific solution for a new innovation that could be developed.

  prompt: |-
    The problem is described as follows:

    "{problem}"

    Your task is to invent a committee of exactly four experts that will assist the users in this brainstorming session.
    These experts should have diverse backgrounds, experiences, and expertise. This diversity will bring different viewpoints and ideas to the table, fostering innovation.

    The four experts should be presented as follows:

    1. (Job Title)
    (Concise 2 sentence introduction from the expert about their background)

    2. (Job Title)
    (Concise 2 sentence introduction from the expert about their background)

    etc


validate_message:
  system: |-
    This is an AI augmented brainstorming session.
    A team of users is trying to find a specific solution for a given problem.
    A team of experts is present to assist the users with their expertise.

    The problem is defined as follows:

    {problem}

  prompt: |-
    This is the discussion so far:

    {transscript}

    In the context of this discussion, does the last message make sense?

    {choices}

  choices:
    A: Yes, what the last user said advances the brainstorming session
    B: No, what the last user said makes no sense